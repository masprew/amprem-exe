<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alight Motion Premium Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Overlay untuk sidebar mobile -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>⚡ Pilih Server</h3>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        
        <div class="server-list" id="serverList">
            <!-- Server akan dimuat di sini -->
        </div>

        <div class="sidebar-footer">
            <button class="refresh-btn" onclick="loadQuota()">
                🔄 Refresh Kuota
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>

        <div class="container" id="mainContainer">
            <div class="logo" id="logo">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="white">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            
            <h1 id="title">Alight Motion Premium</h1>
            <p class="subtitle" id="subtitle">Generator Premium Access</p>

            <div class="server-indicator" id="serverIndicator">
                Server: Auto (Terbaik)
            </div>

            <div class="steps">
                <div class="step active" id="step1">1. Email</div>
                <div class="step" id="step2">2. Verifikasi</div>
                <div class="step" id="step3">3. Premium</div>
            </div>

            <form id="generatorForm">
                <div class="form-step" id="formStep1">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="Masukkan email Anda" required>
                    <button type="button" class="btn" onclick="sendMagicLink()">
                        Kirim Magic Link
                    </button>
                </div>

                <div class="form-step" id="formStep2" style="display:none;">
                    <label for="token">Magic Link (dari email)</label>
                    <input type="text" id="token" placeholder="Tempel magic link dari email">
                    <button type="button" class="btn" onclick="verifyAccount()">
                        Verifikasi Akun
                    </button>
                </div>

                <div class="form-step" id="formStep3" style="display:none;">
                    <div class="success-icon">✅</div>
                    <h2>Verifikasi Berhasil!</h2>
                    <p>Klik tombol untuk aktivasi premium</p>
                    <button type="button" class="btn" onclick="applyPremium()">
                        Aktifkan Premium
                    </button>
                </div>
            </form>

            <div id="statusBox" class="status-box"></div>
            <div id="resultBox" class="result-box"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
