<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alight Motion Premium Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Pilih Server</h3>
            <button class="close-btn" onclick="toggleSidebar()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        
        <div class="server-list" id="serverList">
            <!-- Server akan dimuat di sini -->
        </div>

        <div class="sidebar-footer">
            <button class="refresh-btn" onclick="loadQuota()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 5px;">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Refresh Kuota
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <button class="hamburger" onclick="toggleSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="container" id="mainContainer">
            <div class="logo" id="logo">
                <svg width="35" height="35" viewBox="0 0 24 24" fill="white">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            
            <h1 id="title">Alight Motion Premium</h1>
            <p class="subtitle">Generator Premium Access</p>

            <div class="server-indicator" id="serverIndicator">
                Server: Auto (Terbaik)
            </div>

            <div class="steps">
                <div class="step active" id="step1">1. Email</div>
                <div class="step" id="step2">2. Verifikasi</div>
                <div class="step" id="step3">3. Premium</div>
            </div>

            <form id="generatorForm">
                <div class="form-step" id="formStep1">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="Masukkan email Anda" required>
                    <button type="button" class="btn" onclick="sendMagicLink()">
                        Kirim Magic Link
                    </button>
                </div>

                <div class="form-step" id="formStep2" style="display:none;">
                    <label for="token">Magic Link (dari email)</label>
                    <input type="text" id="token" placeholder="Tempel magic link dari email">
                    <button type="button" class="btn" onclick="verifyAccount()">
                        Verifikasi Akun
                    </button>
                </div>

                <div class="form-step" id="formStep3" style="display:none;">
                    <div class="success-icon">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#00b894" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h2 style="text-align: center; color: #00b894;">Verifikasi Berhasil!</h2>
                    <p style="text-align: center; color: #b2bec3;">Klik tombol untuk aktivasi premium</p>
                    <button type="button" class="btn" onclick="applyPremium()">
                        Aktifkan Premium
                    </button>
                </div>
            </form>

            <div id="statusBox" class="status-box"></div>
            <div id="resultBox" class="result-box"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
